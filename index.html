<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Candidati al Coaching — Coaching by Morgana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2937;
    --slate:#33526B;
    --slate-deep:#233A4C;
    --slate-soft:#7C97AC;
    --bg:#F5F7F9;
    --card:#FFFFFF;
    --line:#E1E7EB;
    --error:#B4453B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    font-family:'DM Sans', sans-serif;
    color:var(--ink);
    padding:32px 16px 60px;
  }
  .wrap{ max-width:600px; margin:0 auto; }
  .eyebrow{
    font-size:13px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--slate-soft); font-weight:700; margin-bottom:8px; text-align:center;
  }
  h1{
    font-family:'Anton', sans-serif; font-weight:400; letter-spacing:.01em;
    font-size:clamp(26px,6vw,34px); color:var(--slate-deep); margin:0 0 6px;
    line-height:1.1; text-align:center;
  }
  .sub{ color:#5B6B76; font-size:14.5px; margin:0 0 28px; text-align:center; }

  .progress-track{ height:5px; background:var(--line); border-radius:100px; overflow:hidden; margin-bottom:28px; }
  .progress-fill{ height:100%; background:var(--slate-deep); border-radius:100px; width:0%; transition:width .3s ease; }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:32px clamp(20px,5vw,36px); min-height:260px; display:flex; flex-direction:column;
  }
  .step-title{
    font-family:'Anton', sans-serif; font-weight:400; font-size:clamp(20px,5vw,24px);
    color:var(--slate-deep); margin:0 0 4px; line-height:1.25;
  }
  .step-sub{ font-family:'DM Sans',sans-serif; font-size:13px; font-weight:400; color:#9AA6AD; margin:0 0 16px; }
  label{ display:block; font-size:14px; font-weight:700; color:var(--ink); margin:16px 0 6px; }
  label:first-of-type{ margin-top:0; }
  label .opt{ font-weight:400; color:#9AA6AD; }
  input[type=text], input[type=email], input[type=tel], input[type=number], input[type=date], textarea{
    width:100%; font-family:'DM Sans', sans-serif; font-size:15px; padding:11px 13px;
    border:1px solid var(--line); border-radius:8px; background:#FBFCFD; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:80px; }
  input:focus, textarea:focus{ outline:none; border-color:var(--slate); box-shadow:0 0 0 3px rgba(51,82,107,0.13); }

  input[type=date]{ -webkit-appearance:none; appearance:none; height:46px; padding:0 13px; line-height:46px; }
  .radio-group{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .radio-chip, .check-chip{ position:relative; display:flex; width:100%; }
  .radio-chip input, .check-chip input{ position:absolute; opacity:0; width:100%; height:100%; cursor:pointer; margin:0; }
.radio-chip span, .check-chip span{
    display:flex; align-items:center; text-align:left;
    padding:12px 16px; border:1px solid var(--line); border-radius:10px;
    font-size:14.5px; color:var(--slate-deep); background:#FBFCFD; line-height:1.35; width:100%;
}
  }  .radio-chip input:checked + span{ background:var(--slate-deep); color:#fff; border-color:var(--slate-deep); }
  .check-chip input:checked + span{ background:#E7EEF2; color:var(--slate-deep); border-color:var(--slate); font-weight:700; }

  .checklist{ display:flex; flex-direction:column; gap:8px; margin-top:6px; }
  .list-check{ position:relative; display:flex; align-items:flex-start; gap:10px; padding:12px 14px;
    border:1px solid var(--line); border-radius:10px; background:#FBFCFD; cursor:pointer; }
  .list-check input{ position:relative; width:18px; height:18px; flex:0 0 18px; margin-top:1px; accent-color:var(--slate-deep); cursor:pointer; }
  .list-check span{ font-size:14.5px; color:var(--ink); line-height:1.35; }
  .list-check.checked{ background:#E7EEF2; border-color:var(--slate); }
  .list-check.checked span{ color:var(--slate-deep); font-weight:700; }

  .conditional{ display:none; margin-top:10px; }
  .conditional.show{ display:block; }

  .nav-row{ display:flex; gap:10px; margin-top:auto; padding-top:28px; }
  .btn-back{
    flex:0 0 auto; background:none; border:1px solid var(--line); color:var(--slate-soft);
    border-radius:8px; padding:0 18px; font-size:14px; font-weight:700; cursor:pointer;
  }
  .btn-next{
    flex:1; background:var(--slate-deep); color:#fff; border:none; border-radius:8px;
    padding:15px; font-family:'DM Sans', sans-serif; font-size:15.5px; font-weight:700; cursor:pointer;
  }
  .btn-next:hover{ background:var(--slate); }
  .btn-next:disabled{ opacity:.6; }
  .err-text{ color:var(--error); font-size:13px; margin-top:10px; display:none; }

  .state{ display:none; text-align:center; padding:50px 20px; }
  .state.active{ display:block; }
  .state .mark{ font-size:30px; margin-bottom:10px; }
  .state h2{ font-family:'Anton', sans-serif; font-weight:400; font-size:24px; color:var(--slate-deep); margin:0 0 8px; }
  .state p{ color:#5B6B76; font-size:15px; line-height:1.5; }
  .submit-btn{
    display:inline-block; text-decoration:none; margin-top:18px; max-width:280px;
    background:var(--slate-deep); color:#fff; border:none; border-radius:8px; padding:15px 24px;
    font-family:'DM Sans', sans-serif; font-size:15.5px; font-weight:700;
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="introBlock">
    <div class="eyebrow">✨ Coaching by Morgana</div>
    <h1>Candidati al Coaching</h1>
    <p class="sub">Rispondi con calma, una domanda alla volta — mi serve per capire come posso aiutarti al meglio.</p>
  </div>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="stepCard"></div>

  <div class="state" id="successState">
    <div class="mark">✨</div>
    <h2 id="successTitle">Grazie!</h2>
    <p id="successMsg"></p>
    <a href="https://calendly.com/morgana-workout/30min" target="_blank" class="submit-btn">Prenota una chiamata conoscitiva</a>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://scupbncjaxqkoaiavrci.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjdXBibmNqYXhxa29haWF2cmNpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxOTc4MTUsImV4cCI6MjEwMzc3MzgxNX0.D815GNFjL38w4kZ9zNZnmAooYkNpOWbisJ49mmGgaQI";

  const CONDIZIONI_SALUTE = [
    { value: "ipertensione", label: "Ipertensione" },
    { value: "pavimento_pelvico", label: "Pavimento pelvico" },
    { value: "ginocchia", label: "Ginocchia doloranti / scarsa mobilità" },
    { value: "lombare", label: "Zona lombare / iperlordosi" },
    { value: "spalle", label: "Spalle / cifosi / anteposizione" },
    { value: "anche", label: "Anche bloccate / dolorose" },
    { value: "caviglie", label: "Caviglia rigida / scarsa mobilità" },
    { value: "valgismo", label: "Valgismo ginocchia" },
  ];

  const steps = [
    { title: "Come vuoi allenarti?", fields: [
      { type: 'chip', name: 'tipo_servizio', required: true, options: [
        { label: 'Online', value: 'online' },
                  { label: 'In presenza su Torino (Bulb)', value: 'presenza' },
        { label: 'Ibrido', value: 'ibrido' },
      ]},
    ]},
    { title: "Dove ti alleneresti?", fields: [
      { type: 'chip', name: 'sede_abituale', required: true, options: [
        { label: 'Via San Secondo 39, Torino', value: 'Via San Secondo 39, Torino' },
        { label: 'Via Fratelli Calandra 6, Torino', value: 'Via Fratelli Calandra 6, Torino' },
      ], conditionalOn: { name: 'tipo_servizio', notValue: 'online' } },
    ]},
    { title: "Qualche dato su di te", fields: [
      { type: 'date', name: 'data_nascita', label: 'Data di nascita', required: true },
      { type: 'chip', name: 'sesso', required: true, options: [
        { label: 'Donna', value: 'F' }, { label: 'Uomo', value: 'M' },
      ]},
      { type: 'number', name: 'altezza_cm', label: 'Altezza (cm)', min: 120, max: 220, required: false },
      { type: 'number', name: 'peso_kg', label: 'Peso (kg)', min: 30, max: 200, step: 0.1, required: false },
      { type: 'text', name: 'citta', label: 'Città', required: false },
    ]},
    { title: "Che lavoro fai?", subtitle: "E quanto ti muovi durante la giornata", fields: [
      { type: 'text', name: 'tipo_lavoro', label: 'Lavoro', placeholder: 'es. impiegata in ufficio', required: false },
      { type: 'chip', name: 'livello_attivita', required: true, options: [
        { label: 'Sedentaria', value: 'sedentario' },
        { label: 'Moderatamente attiva', value: 'intermedio' },
        { label: 'Molto attiva', value: 'attivo' },
      ]},
    ]},
    { title: "Come ti definiresti in palestra?", fields: [
      { type: 'chip', name: 'livello_allenamento', required: true, options: [
        { label: 'Alle prime armi', value: 'base' },
        { label: 'Ho già esperienza', value: 'intermedia' },
        { label: 'Molto esperta', value: 'avanzata' },
      ]},
    ]},
    { title: "Qual è il tuo obiettivo principale?", fields: [
      { type: 'chip', name: 'obiettivo_attuale', required: true, options: [
        { label: 'Perdere grasso / definizione', value: 'definizione' },
        { label: 'Ricomposizione corporea', value: 'mantenimento' },
        { label: 'Aumento massa muscolare', value: 'massa' },
      ]},
    ]},
    { title: "Hai patologie, infortuni o zone del corpo che ti creano fastidio?", subtitle: "Seleziona pure più di una", fields: [
      { type: 'checklist', name: 'problematiche_salute', exclusiveValue: 'nessuna', options: [
        ...CONDIZIONI_SALUTE,
        { label: 'Altro', value: 'altro' },
        { label: 'Nessuna', value: 'nessuna' },
      ]},
      { type: 'textarea', name: 'problematiche_salute_note', placeholder: "Dimmi di più (dove, da quanto tempo, se hai un referto medico...)", conditionalOn: { name: 'problematiche_salute', anyExcept: 'nessuna' } },
    ]},
    { title: "Note aggiuntive", subtitle: "Facoltativo — qualsiasi cosa ritieni utile per me", fields: [
      { type: 'textarea', name: 'note', placeholder: "Raccontami di te, cosa vorresti ottenere...", required: false },
    ]},
    { title: "Ultimo step: i tuoi contatti", subtitle: "Mi servono per ricontattarti", final: true, fields: [
      { type: 'text', name: 'nome', label: 'Nome', required: true },
      { type: 'text', name: 'cognome', label: 'Cognome', required: true },
      { type: 'email', name: 'email', label: 'Email', required: true },
      { type: 'tel', name: 'telefono', label: 'Telefono', required: true },
    ]},
  ];

  let current = 0;
  const answers = {};

  function optLabel(f, value){
    const o = f.options.find((o) => o.value === value);
    return o ? o.label : value;
  }

  function isFieldVisible(f){
    if (!f.conditionalOn) return true;
    const cond = f.conditionalOn;
    if (cond.value !== undefined) return answers[cond.name] === cond.value;
    if (cond.notValue !== undefined) return answers[cond.name] !== undefined && answers[cond.name] !== cond.notValue;
    if (cond.anyExcept !== undefined) {
      const v = answers[cond.name] || [];
      return v.some((x) => x !== cond.anyExcept);
    }
    return true;
  }

  function fieldHTML(f){
    const shown = isFieldVisible(f);
    const wrapOpen = f.conditionalOn ? '<div class="conditional' + (shown ? ' show' : '') + '" data-field="' + f.name + '">' : '';
    const wrapClose = f.conditionalOn ? '</div>' : '';

    let inner = '';
    if (f.type === 'chip') {
      inner += '<div class="radio-group">' + f.options.map((o) =>
        '<label class="radio-chip"><input type="radio" name="' + f.name + '" value="' + o.value + '" ' + (answers[f.name] === o.value ? 'checked' : '') + '><span>' + o.label + '</span></label>'
      ).join('') + '</div>';
    } else if (f.type === 'checkbox') {
      const vals = answers[f.name] || [];
      inner += '<div class="radio-group">' + f.options.map((o) =>
        '<label class="check-chip"><input type="checkbox" name="' + f.name + '" value="' + o.value + '" ' + (vals.includes(o.value) ? 'checked' : '') + '><span>' + o.label + '</span></label>'
      ).join('') + '</div>';
    } else if (f.type === 'checklist') {
      const vals = answers[f.name] || [];
      inner += '<div class="checklist">' + f.options.map((o) =>
        '<label class="list-check' + (vals.includes(o.value) ? ' checked' : '') + '"><input type="checkbox" name="' + f.name + '" value="' + o.value + '" ' + (vals.includes(o.value) ? 'checked' : '') + '><span>' + o.label + '</span></label>'
      ).join('') + '</div>';
    } else if (f.type === 'textarea') {
      inner += (f.label ? '<label>' + f.label + '</label>' : '') + '<textarea name="' + f.name + '" placeholder="' + (f.placeholder || '') + '">' + (answers[f.name] || '') + '</textarea>';
    } else {
      inner += (f.label ? '<label>' + f.label + (f.required === false ? ' <span class="opt">(facoltativo)</span>' : '') + '</label>' : '') +
        '<input type="' + f.type + '" name="' + f.name + '" placeholder="' + (f.placeholder || '') + '" value="' + (answers[f.name] || '') + '"' +
        (f.min ? (' min="' + f.min + '"') : '') + (f.max ? (' max="' + f.max + '"') : '') + (f.step ? (' step="' + f.step + '"') : '') + '>';
    }
    return wrapOpen + inner + wrapClose;
  }

  function render(){
    const step = steps[current];
    const total = steps.length;
    document.getElementById('progressFill').style.width = Math.round((current / total) * 100) + '%';

    let html = '<div class="step-title">' + step.title + '</div>';
    if (step.subtitle) html += '<div class="step-sub">' + step.subtitle + '</div>';
    html += step.fields.map(fieldHTML).join('');
    html += '<div class="err-text" id="stepErr">Rispondi per continuare.</div>';
    html += '<div class="nav-row">' +
      (current > 0 ? '<button class="btn-back" onclick="goBack()">← Indietro</button>' : '') +
      '<button class="btn-next" onclick="goNext()">' + (step.final ? 'Invia candidatura' : 'Avanti →') + '</button>' +
      '</div>';

    document.getElementById('stepCard').innerHTML = html;
    attachListeners();
  }

  function refreshConditionals(){
    document.querySelectorAll('.conditional').forEach((box) => {
      const name = box.dataset.field;
      const f = steps[current].fields.find((x) => x.name === name);
      box.classList.toggle('show', isFieldVisible(f));
    });
  }

  function attachListeners(){
    document.querySelectorAll('#stepCard input[type=radio]').forEach((inp) => {
      inp.addEventListener('change', () => { saveCurrentStep(); refreshConditionals(); });
    });
    document.querySelectorAll('#stepCard input[type=checkbox]').forEach((inp) => {
      inp.addEventListener('change', () => {
        const field = steps[current].fields.find((f) => f.name === inp.name);
        if (field && field.exclusiveValue) {
          const boxes = document.querySelectorAll('#stepCard input[name="' + inp.name + '"]');
          if (inp.value === field.exclusiveValue && inp.checked) {
            boxes.forEach((b) => { if (b !== inp) b.checked = false; });
          } else if (inp.checked) {
            boxes.forEach((b) => { if (b.value === field.exclusiveValue) b.checked = false; });
          }
        }
        document.querySelectorAll('#stepCard input[name="' + inp.name + '"]').forEach((b) => {
          if (b.closest('.list-check')) b.closest('.list-check').classList.toggle('checked', b.checked);
        });
        saveCurrentStep();
        refreshConditionals();
      });
    });
  }

  function saveCurrentStep(){
    const step = steps[current];
    step.fields.forEach((f) => {
      if (f.type === 'checkbox' || f.type === 'checklist') {
        const checked = Array.from(document.querySelectorAll('#stepCard input[name="' + f.name + '"]:checked')).map((i) => i.value);
        answers[f.name] = checked;
      } else if (f.type === 'chip') {
        const sel = document.querySelector('#stepCard input[name="' + f.name + '"]:checked');
        answers[f.name] = sel ? sel.value : '';
      } else {
        const el = document.querySelector('#stepCard [name="' + f.name + '"]');
        if (el) answers[f.name] = el.value;
      }
    });
  }

  function validateCurrentStep(){
    const step = steps[current];
    for (const f of step.fields) {
      if (!isFieldVisible(f) && f.conditionalOn) continue;
      if (f.required === false || f.required === undefined && f.type !== 'chip') {
        if (f.required !== true) continue;
      }
      if (f.type === 'checkbox' || f.type === 'checklist') continue;
      if (f.required === true) {
        if (!answers[f.name] || (Array.isArray(answers[f.name]) && answers[f.name].length === 0)) return false;
      }
    }
    return true;
  }

  function goBack(){
    saveCurrentStep();
    current--;
    if (current > 0 && steps[current].fields.every((f) => f.conditionalOn && !isFieldVisible(f))) {
      current--;
    }
    render();
  }

  async function goNext(){
    saveCurrentStep();
    const errEl = document.getElementById('stepErr');
    if (!validateCurrentStep()) {
      errEl.style.display = 'block';
      return;
    }
    errEl.style.display = 'none';

    const step = steps[current];
    if (step.final) {
      await submitAll();
      return;
    }
    current++;
    if (steps[current].fields.every((f) => f.conditionalOn && !isFieldVisible(f))) {
      current++;
    }
    render();
  }

  async function submitAll(){
    const btn = document.querySelector('#stepCard .btn-next');
    btn.disabled = true;
    btn.textContent = 'Invio in corso...';
    const errEl = document.getElementById('stepErr');

    const problematiche = (answers.problematiche_salute || []).filter((v) => v !== 'nessuna');

    const payload = {
      nome: (answers.nome || '').trim(),
      cognome: (answers.cognome || '').trim() || null,
      email: (answers.email || '').trim(),
      telefono: (answers.telefono || '').trim() || null,
      data_nascita: answers.data_nascita || null,
      sesso: answers.sesso || null,
      altezza_cm: answers.altezza_cm ? Number(answers.altezza_cm) : null,
      peso_kg: answers.peso_kg ? Number(answers.peso_kg) : null,
      citta: answers.citta || null,
      tipo_lavoro: answers.tipo_lavoro || null,
      livello_attivita: answers.livello_attivita || null,
      livello_allenamento: answers.livello_allenamento || null,
      obiettivo_attuale: answers.obiettivo_attuale || null,
      tipo_servizio: answers.tipo_servizio,
      sede_abituale: answers.tipo_servizio === 'online' ? null : (answers.sede_abituale || null),
      problematiche_salute: problematiche,
      problematiche_salute_note: answers.problematiche_salute_note || null,
      note: answers.note || null,
    };

    try {
      const res = await fetch(SUPABASE_URL + '/rest/v1/candidature', {
        method: 'POST',
        headers: {
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal',
        },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error('invio non riuscito');
    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Invia candidatura';
      errEl.textContent = "Qualcosa non ha funzionato, riprova tra un momento.";
      errEl.style.display = 'block';
      return;
    }

    const nome = (answers.nome || '').trim();
    document.getElementById('successTitle').textContent = nome ? ('Grazie, ' + nome + '!' ) : 'Grazie!';
    document.getElementById('successMsg').textContent =
      "Ho ricevuto la tua candidatura ✨ La guardo con calma e ti ricontatto a breve per una chiamata conoscitiva e decidere insieme il percorso migliore per te.";

    document.getElementById('introBlock').style.display = 'none';
    document.getElementById('progressFill').parentElement.style.display = 'none';
    document.getElementById('stepCard').style.display = 'none';
    document.getElementById('successState').classList.add('active');
  }

  render();
</script>
</body>
</html>
